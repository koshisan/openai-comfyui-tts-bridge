services:
  tts-bridge:
    build: .
    container_name: tts-bridge
    restart: unless-stopped
    ports:
      - "7780:7780"
    volumes:
      # Mount your local config here. See config/config.example.yaml.
      - ./config:/etc/tts-bridge:ro
    environment:
      TTS_BRIDGE_CONFIG: /etc/tts-bridge/config.yaml
      TTS_BRIDGE_VOICES: /etc/tts-bridge/voices.yaml
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:7780/health',timeout=3).status==200 else 1)"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Wyoming Protocol bridge — HA connects here (host + port), it talks OpenAI HTTP to tts-bridge.
  # https://github.com/roryeckel/wyoming_openai
  wyoming_openai:
    image: ghcr.io/roryeckel/wyoming_openai:latest
    container_name: wyoming_openai
    restart: unless-stopped
    ports:
      - "10300:10300"
    depends_on:
      tts-bridge:
        condition: service_healthy
    environment:
      WYOMING_URI: tcp://0.0.0.0:10300
      WYOMING_LOG_LEVEL: INFO
      # Languages this proxy advertises to Home Assistant. Higgs supports 100+
      # so this list is only what HA users see in the voice picker.
      WYOMING_LANGUAGES: de,en,ja
      # Point wyoming_openai at our OpenAI-compatible bridge.
      # `tts-bridge` resolves via the compose network.
      TTS_OPENAI_URL: http://tts-bridge:7780/v1
      TTS_BACKEND: "OPENAI"
      # Model name is passed through to our bridge (which ignores it) and shown
      # to HA. Any string works.
      TTS_MODELS: "nadeko"
      # Voice names advertised to HA. Must match a voice in voices.yaml.
      TTS_VOICES: "nadeko"
      TTS_SPEED: "1.0"
